name: CodeQL

# This repo has no Python/JS source (shell is not CodeQL-supported), so the
# analyzable surface is the GitHub Actions workflows themselves. Actions are
# github-owned and SHA-pinned, so no actions-allowlist change is required.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '27 11 * * 0' # weekly, Sunday 11:27 UTC
  workflow_dispatch:

# Least-privilege default; the analyze job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: actions

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:actions"
